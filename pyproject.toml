[project]
name = "gitweek"
version = "0.1.0"
description = "Summarize your Git activity for the past week, across one repo or a whole folder of them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
ai = ["httpx>=0.27"]

[project.scripts]
gitweek = "gitweek.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gitweek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
